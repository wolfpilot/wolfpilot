    64.1026% { opacity: 1; filter: hue-rotate(0deg); animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    100% { opacity: 1; filter: hue-rotate(0deg); }
  }
  @keyframes k12 {
    0% { transform: scale(1.1111); }
    39.3162% { transform: scale(1.1111); animation-timing-function: cubic-bezier(0.68,-0.55,0.27,1.55); }
    49.5726% { transform: scale(1); animation-timing-function: cubic-bezier(0.68,-0.55,0.27,1.55); }
    100% { transform: scale(1); }
  }
  @keyframes k13 {
    0% { opacity: 1; stroke-dashoffset: 1; }
    23.9316% { opacity: 0; stroke-dashoffset: 1; animation-timing-function: linear; }
    39.3162% { opacity: 1; stroke-dashoffset: 0; animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    54.7009% { opacity: 0; animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    100% { opacity: 0; stroke-dashoffset: 0; }
  }
  @keyframes k14 {
    0% { opacity: 0; }
    39.3162% { opacity: 0; animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    49.5726% { opacity: 1; animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    100% { opacity: 1; }
  }
  </style>
