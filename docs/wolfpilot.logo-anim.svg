<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="750" viewBox="0 0 1500 750">
  <!-- wolfpilot.co splash animation. Loops every 5.85s (0.5s delay, 3.75s animation, 1s hold, 0.6s fade out). -->
  <style>
  .tf { transform-box: fill-box; transform-origin: center; }
  .lg__contour-path { fill: none; stroke: #151515; stroke-dasharray: 1; }
  #backdrop, #logo, #logo * { animation-duration: 5.85s; animation-iteration-count: infinite; animation-fill-mode: both; }
  #backdrop { animation-name: k0; }
  #logo { animation-name: k1; }
  #triangle { animation-name: k2; }
  #triangle .lg__contour-path-top { animation-name: k3; }
  #triangle .lg__contour-path-bottom { animation-name: k4; }
  #triangle .lg__shading-path { animation-name: k5; }
  #details { animation-name: k6; }
  #details .lg__shading-path-1 { animation-name: k7; }
  #details .lg__shading-path-2 { animation-name: k8; }
  #details .lg__shading-path-3 { animation-name: k9; }
  #details .lg__shading-path-4 { animation-name: k10; }
  #details .lg__shading-path-5 { animation-name: k11; }
  #letter { animation-name: k12; }
  #letter .lg__contour-path { animation-name: k13; }
  #letter .lg__shading-path { animation-name: k14; }
  @keyframes k0 {
    0% { opacity: 0; transform: scale(1.15); }
    8.547% { opacity: 0; transform: scale(1.15); animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    40.5983% { opacity: 1; transform: scale(1); animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    50.2137% { opacity: 0.75; transform: scale(1.25); animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    63.0342% { opacity: 0.5; transform: scale(1.5); animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    72.6496% { opacity: 0; transform: scale(20); animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    100% { opacity: 0; transform: scale(20); }
  }
  @keyframes k1 {
    0% { transform: scale(1.0417); opacity: 1; }
    8.547% { transform: scale(1.0417); animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    40.5983% { transform: scale(1.0417,1.0063); animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    50.2137% { transform: scale(1.0375); animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    63.0342% { transform: scale(1.0375); animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    72.6496% { transform: scale(1.0417); animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    89.7436% { opacity: 1; animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    100% { transform: scale(1.0417); opacity: 0; animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
  }
  @keyframes k2 {
    0% { transform: scale(1.1111); }
    62.3932% { transform: scale(1.1111); animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    72.6496% { transform: scale(1); animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    100% { transform: scale(1); }
  }
  @keyframes k3 {
    0% { opacity: 1; stroke-dashoffset: 1; }
    13.6752% { opacity: 0; stroke-dashoffset: 1; animation-timing-function: linear; }
    29.0598% { opacity: 1; stroke-dashoffset: 0; animation-timing-function: linear; }
    54.7009% { opacity: 1; animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    70.0855% { opacity: 0; animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    100% { opacity: 0; stroke-dashoffset: 0; }
  }
  @keyframes k4 {
    0% { opacity: 1; stroke-dashoffset: 1; }
    18.8034% { opacity: 0; stroke-dashoffset: 1; animation-timing-function: linear; }
    34.188% { opacity: 1; stroke-dashoffset: 0; animation-timing-function: linear; }
    54.7009% { opacity: 1; animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    70.0855% { opacity: 0; animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    100% { opacity: 0; stroke-dashoffset: 0; }
  }
  @keyframes k5 {
    0% { opacity: 0; filter: hue-rotate(-270deg); }
    62.3932% { opacity: 0; filter: hue-rotate(-270deg); animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    72.6496% { opacity: 1; filter: hue-rotate(0deg); animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    100% { opacity: 1; filter: hue-rotate(0deg); }
  }
  @keyframes k6 {
    0% { transform: scale(1.1111); }
    53.8462% { transform: scale(1.1111); animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    64.1026% { transform: scale(1); animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    100% { transform: scale(1); }
  }
  @keyframes k7 {
    0% { opacity: 0; filter: hue-rotate(-270deg); }
    47.0085% { opacity: 0; filter: hue-rotate(-270deg); animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    57.265% { opacity: 1; filter: hue-rotate(0deg); animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    100% { opacity: 1; filter: hue-rotate(0deg); }
  }
  @keyframes k8 {
    0% { opacity: 0; filter: hue-rotate(-270deg); }
    48.7179% { opacity: 0; filter: hue-rotate(-270deg); animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    58.9744% { opacity: 1; filter: hue-rotate(0deg); animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    100% { opacity: 1; filter: hue-rotate(0deg); }
  }
  @keyframes k9 {
    0% { opacity: 0; filter: hue-rotate(-270deg); }
    50.4274% { opacity: 0; filter: hue-rotate(-270deg); animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    60.6838% { opacity: 1; filter: hue-rotate(0deg); animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    100% { opacity: 1; filter: hue-rotate(0deg); }
  }
  @keyframes k10 {
    0% { opacity: 0; filter: hue-rotate(-270deg); }
    52.1368% { opacity: 0; filter: hue-rotate(-270deg); animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
    62.3932% { opacity: 1; filter: hue-rotate(0deg); animation-timing-function: cubic-bezier(0.4,0,0.2,1); }
